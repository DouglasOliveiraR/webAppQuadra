<!doctype html>
<html lang="pt-BR" translate="no">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo_peladafc.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#A8C7FA" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>Pelada FC Manager</title>
  </head>
  <body>
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let r of registrations) {
            if (r.active && r.active.scriptURL.endsWith('service-worker.js')) {
              r.unregister().then(() => console.log('Legacy service-worker.js unregistered.'));
            }
          }
        });
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
